name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf autoconf-archive libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential libfreetype6-dev

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Fetch python-for-android (without full build yet)
        run: |
          yes | buildozer android p4a -- --help || true

      - name: Remove broken reportlab recipe (forces plain pip install)
        run: |
          RECIPE_DIR=".buildozer/android/platform/python-for-android/pythonforandroid/recipes/reportlab"
          if [ -d "$RECIPE_DIR" ]; then
            echo "Uklanjam stari reportlab recept: $RECIPE_DIR"
            rm -rf "$RECIPE_DIR"
          else
            echo "Reportlab recept nije pronadjen (mozda vec uklonjen ili p4a jos nije skinut) - nastavljam."
          fi

      - name: Install reportlab directly
        run: |
          python -m venv .reportlab-venv
          .reportlab-venv/bin/python -m pip install --upgrade pip setuptools wheel
          .reportlab-venv/bin/python -m pip install reportlab==3.6.12 certifi et_xmlfile openpyxl pillow

      - name: Vendor reportlab into app source
        run: |
          .reportlab-venv/bin/python - <<'PY'
          import importlib.util
          import shutil
          from pathlib import Path

          spec = importlib.util.find_spec("reportlab")
          if spec is None or spec.origin is None:
              raise SystemExit("reportlab nije instaliran")

          source_dir = Path(spec.origin).resolve().parent
          target_dir = Path("reportlab")

          if target_dir.exists():
              shutil.rmtree(target_dir)

          shutil.copytree(
              source_dir,
              target_dir,
              ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "*.pyo"),
          )

          for pattern in (
              "lib/_rl_accel.*",
              "lib/pyHnj.*",
              "graphics/_renderPM.*",
          ):
              for path in target_dir.glob(pattern):
                  path.unlink()

          print(f"Vendored reportlab: {source_dir} -> {target_dir}")
          PY

      - name: Build APK with buildozer
        run: |
          yes | buildozer android debug
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taksi-app-apk
          path: bin/*.apk
